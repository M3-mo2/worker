[www]
; A1: full consolidated disable_functions — single source of truth (php.ini's list
; is discarded because php_admin_value overrides, not merges, php.ini).
; NOTE: `eval` is a language construct, NOT a function, so it CANNOT be disabled
; via disable_functions. Adding it here is silently ineffective. We contain eval
; by removing all exec/shell paths and confining via open_basedir instead.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,proc_close,proc_nice,proc_terminate,proc_get_status,pcntl_alarm,pcntl_async_signals,pcntl_errno,pcntl_exec,pcntl_fork,pcntl_get_last_error,pcntl_getpriority,pcntl_setpriority,pcntl_signal,pcntl_signal_dispatch,pcntl_signal_get_handler,pcntl_sigprocmask,pcntl_sigtimedwait,pcntl_sigwaitinfo,pcntl_spawn,pcntl_strerror,pcntl_unshare,pcntl_wait,pcntl_waitpid,pcntl_wexitstatus,pcntl_wifcontinued,pcntl_wifexited,pcntl_wifsignaled,pcntl_wifstopped,pcntl_wstopsig,pcntl_wtermsig,posix_access,posix_ctermid,posix_errno,posix_getcwd,posix_getegid,posix_geteuid,posix_getgid,posix_getgroups,posix_getlogin,posix_getpgid,posix_getpgrp,posix_getpid,posix_getppid,posix_getsid,posix_getuid,posix_get_last_error,posix_initgroups,posix_isatty,posix_kill,posix_mkfifo,posix_mknod,posix_setegid,posix_seteuid,posix_setgid,posix_setgroups,posix_setpgid,posix_setsid,posix_setuid,posix_strerror,posix_times,posix_ttyname,posix_uname,getenv,putenv,ini_set,set_time_limit,ignore_user_abort,chmod,chown,rename,unlink,link,symlink,readlink,touch,assert,unserialize,phpinfo,scandir,opendir,readdir,closedir,rewinddir,glob,DirectoryIterator,RecursiveDirectoryIterator,FilesystemIterator,dl
catch_workers_output = yes
; A2: scrub the FPM environment so user PHP cannot read worker secrets (e.g.
; INTERNAL_SECRET, CF_WEBHOOK_BASE) via getenv(); restrict input vars to
; GET/POST/COOKIE/SERVER.
clear_env = yes
php_admin_value[variables_order] = "GPCS"
; C3: hard-kill any PHP request running longer than 25s at the FPM level, so one
; runaway/infinite-loop bot cannot pin a shared worker process forever. Sits just
; under the worker's 30s httpx timeout (and the max_execution_time=25 php_admin_value).
request_terminate_timeout = 25
; C2: per-request resource caps moved here from the Caddyfile PHP_ADMIN_VALUE
; (kept as global pool limits — they don't depend on the per-user path).
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 25
; Temp + session dir outside the per-user folder and outside /tmp (which is no
; longer in open_basedir). Shared across users but not writable by user PHP code
; except via the standard temp functions; revisit for per-user temp if needed.
php_admin_value[sys_temp_dir] = /opt/phptmp
php_admin_value[session.save_path] = /opt/phptmp
