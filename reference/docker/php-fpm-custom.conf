[www]
; open_basedir is set dynamically by Caddy per-request via PHP_ADMIN_VALUE.
; The pool-level setting is removed to allow Caddy to manage it.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
catch_workers_output = yes


; Clear environment variables for security, except for what we explicitly need.
clear_env = no
